
name: absensi_bon_app
description: A simple absensi & bon karyawan app.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  image_picker: ^1.0.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  app_links: ^6.4.1
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  http_parser: ^4.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/cloudflare_worker.js
    - assets/cloudflare_migrations.json
